[package]
name = "uboat-radio-desktop"
version = "0.0.0"
description = "Desktop shell for the U-Boat Radio Operator static bundle"
edition = "2021"
rust-version = "1.82"
publish = false
license = "MIT OR Apache-2.0"

[build-dependencies]
tauri-build = { version = "=2.7.4", default-features = false , features = [] }

[dependencies]
# Exact pins (AGENTS.md s7). No plugins: the shell exposes no IPC command, shell, fs or network capability.
tauri = { version = "=2.12.5", default-features = false, features = ["wry", "compression", "common-controls-v6"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
