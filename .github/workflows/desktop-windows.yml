name: Desktop installer (Windows)

on:
  pull_request:
    paths:
      - "packages/desktop/**"
      - "packages/radio-ui/**"
      - "packages/sim-core/**"
      - ".github/workflows/desktop-windows.yml"
  push:
    branches: [main]
    paths:
      - "packages/desktop/**"
      - "packages/radio-ui/**"
      - "packages/sim-core/**"
      - ".github/workflows/desktop-windows.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a GitHub pre-release with this tag from main (desktop-preview-YYYYMMDD, or desktop-preview-YYYYMMDD-N for a second one the same day; a tag is never reused). Leave empty to only build."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.12"
      - name: Install radio-ui dependencies from the lockfile
        working-directory: packages/radio-ui
        run: npm ci --ignore-scripts
      - name: Typecheck and test radio-ui
        working-directory: packages/radio-ui
        run: |
          npm run typecheck
          npm test
      - name: Install desktop dependencies from the lockfile
        working-directory: packages/desktop
        run: npm ci --ignore-scripts
      - name: Build the NSIS installer (Cargo.lock enforced)
        working-directory: packages/desktop
        run: node node_modules/@tauri-apps/cli/tauri.js build -- --locked
      - name: Record installer checksum
        shell: pwsh
        run: |
          $dir = "packages/desktop/src-tauri/target/release/bundle/nsis"
          $exe = Get-ChildItem -Path $dir -Filter *.exe
          if ($exe.Count -ne 1) { throw "expected exactly one installer in $dir, found $($exe.Count)" }
          $hash = (Get-FileHash -Algorithm SHA256 -Path $exe[0].FullName).Hash.ToLowerInvariant()
          "$hash  $($exe[0].Name)" | Set-Content -Path "$dir/SHA256SUMS.txt" -Encoding ascii
          Get-Content "$dir/SHA256SUMS.txt"
      - name: Retain installer (unsigned)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uboat-radio-windows-installer-${{ github.sha }}
          path: |
            packages/desktop/src-tauri/target/release/bundle/nsis/*.exe
            packages/desktop/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  prerelease:
    # Publishing is opt-in: only a manual run on main that names a tag. Needs the write scope, so it lives in its own job.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag != ''
    needs: installer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      ARTIFACT: uboat-radio-windows-installer-${{ github.sha }}
    steps:
      - name: Validate the tag name
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^desktop-preview-[0-9]{8}(-[0-9]{1,2})?$ ]] || { echo "tag must match desktop-preview-YYYYMMDD or desktop-preview-YYYYMMDD-N" >&2; exit 1; }
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then echo "tag $RELEASE_TAG already exists: a published tag is never reused" >&2; exit 1; fi
      - name: Download the installer built by this run
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: ${{ env.ARTIFACT }}
          path: release
      - name: Verify the installer against its recorded checksum
        working-directory: release
        run: |
          ls -l
          # the checksum file is written on Windows (CRLF): strip the CR before checking
          tr -d '\r' < SHA256SUMS.txt | sha256sum --check -
      - name: Name the asset the way GitHub will serve it
        working-directory: release
        run: |
          # GitHub turns spaces in asset names into dots, so a checksum file that lists the spaced name cannot be checked after a download.
          # The hash was verified above; rename, rewrite the list for the new name and check it again.
          for f in ./*.exe; do n="${f// /.}"; [ "$f" = "$n" ] || mv -- "$f" "$n"; done
          sha256sum -- *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release
        run: |
          cat > notes.md <<NOTES
          Development preview of the Windows installer (VERSION v0.0.0.0, not a supported release).

          - **Unsigned**: Windows SmartScreen shows "Unknown publisher" (More info, Run anyway).
          - Verify the download against SHA256SUMS.txt before running it.
          - Built from commit ${GITHUB_SHA} by workflow run ${GITHUB_RUN_ID}.
          NOTES
          gh release create "$RELEASE_TAG" ./*.exe ./SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Windows installer preview ($RELEASE_TAG)" --notes-file notes.md
