name: Supply-chain security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Trivy 0.70.0 (the version aquasecurity/trivy-action v0.36.0 installed) run from its official image, pinned by the
  # multi-arch index digest. The runner pulls it from the same registry as the example image's base image, instead of
  # downloading a release binary from github.com/releases (that download exits with curl code 6 on the runners).
  # Bump: look up the new tag's digest on Docker Hub (aquasec/trivy), review the release notes, replace tag and digest.
  TRIVY_IMAGE: aquasec/trivy@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e # 0.70.0

jobs:
  filesystem-and-sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan repository filesystem
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work:ro" \
            --volume "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" fs \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            /work
      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - name: Retain SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repository-sbom-${{ github.sha }}
          path: sbom.spdx.json
          if-no-files-found: error
          retention-days: 30

  example-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build digest-pinned example image
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          docker build --file examples/fastapi/Dockerfile \
            --build-arg VERSION="$version" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --tag "repo-template-example:$version" .
          echo "IMAGE_REF=repo-template-example:$version" >> "$GITHUB_ENV"
      - name: Scan example image
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            "$IMAGE_REF"
