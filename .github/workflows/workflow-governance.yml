name: Workflow governance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-repository:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Validate repository schemas and governance
        shell: pwsh
        run: ./scripts/check-repo.ps1

  require-task-record:
    runs-on: ubuntu-latest
    steps:
      - name: Require a relevant non-deleted task record
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            let files;
            if (context.eventName === 'pull_request') {
              files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              });
            } else {
              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                owner: context.repo.owner,
                repo: context.repo.repo,
                basehead: `${context.payload.before}...${context.payload.after}`,
              });
              files = comparison.data.files ?? [];
            }

            const taskFiles = files.filter(({ filename, status }) =>
              filename.startsWith('memory/tasks/') && filename.endsWith('.md') &&
              !filename.endsWith('README.md') && !filename.endsWith('task-template.md') &&
              status !== 'removed'
            );
            if (taskFiles.length === 0) {
              const dependabotAllowed = context.actor === 'dependabot[bot]' && files.every(({ filename }) =>
                filename.startsWith('.github/workflows/') ||
                filename === 'examples/fastapi/pyproject.toml' ||
                filename === 'examples/fastapi/uv.lock' ||
                filename === 'examples/fastapi/requirements.lock'
              );
              if (dependabotAllowed) {
                core.notice('Verified Dependabot-only dependency update; task record exception applied.');
                return;
              }
              core.setFailed('Every repository mutation requires a changed, non-deleted task record under memory/tasks/.');
              return;
            }

            if (context.eventName !== 'pull_request') return;
            const body = context.payload.pull_request.body ?? '';
            const linkedTask = taskFiles.find(({ filename }) => body.includes(filename));
            if (!linkedTask) {
              core.setFailed('PR body must link one of the task records changed by this pull request.');
              return;
            }

            const response = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: linkedTask.filename,
              ref: context.payload.pull_request.head.sha,
            });
            const content = Buffer.from(response.data.content, 'base64').toString('utf8');
            const requiredKeys = [
              'schema_version:', 'id:', 'status:', 'owner:', 'goal_confirmed_at:',
              'base_commit:', 'owned_paths:'
            ];
            const missing = requiredKeys.filter(key => !content.includes(key));
            if (missing.length > 0) {
              core.setFailed(`Linked task record lacks required frontmatter: ${missing.join(', ')}`);
            }
